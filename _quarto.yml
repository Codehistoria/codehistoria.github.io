project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - /data/*.csv
    - /data/*.json
    - /tools/plum-pudding/**
    - /tools/age-of-data-skills/**

execute:
  freeze: auto

website:
  title: "James Freeman"
  site-url: https://jamesfreemanhistorian.com
  description: "History, politics and data: research and writing on modern British politics, with interactive visualisations."
  navbar:
    left:
      - href: publications.qmd
        text: Publications
      - href: tools/index.qmd
        text: Tools
  page-footer:
    left: "© 2026 James Freeman"
    right: "Built with [Quarto](https://quarto.org) · Hosted on GitHub Pages"

format:
  html:
    theme: custom.scss
    toc: false
    smooth-scroll: false
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
